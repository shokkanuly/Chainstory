[package]
name = "story-attest"
version = "0.1.0"
description = "ChainStory ZK-Compressed Story Receipts on Solana via Light Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "story_attest"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
light-sdk = "0.9.0"

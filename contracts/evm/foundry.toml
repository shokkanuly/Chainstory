[profile.default]
src = "src"
test = "test"
out = "out/forge"
# OpenZeppelin resolves from the repo's node_modules, so Foundry and the EVM
# suite compile against the identical, already-verified library version.
libs = ["lib", "../../node_modules"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1024

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tripwire — Cross-Chain Circuit Breaker for Bridges</title>
    <meta name="description" content="A predictive cross-chain circuit breaker. An ML risk oracle scores every bridge transfer across Ethereum, Arbitrum, Base, Optimism and Solana, and pauses a single route the moment risk crosses threshold." />
    <meta property="og:title" content="Tripwire — Cross-Chain Circuit Breaker for Bridges" />
    <meta property="og:description" content="Detection is fast; response is slow. Tripwire turns the three days it took to freeze a bridge exploit into the minutes a human review actually needs." />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Google Fonts — Premium Stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Gating Script for Zero FOUT -->
    <script>
      (function() {
        document.documentElement.classList.add('fonts-pending');
        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('600 1em "Plus Jakarta Sans"'),
            document.fonts.load('400 1em "JetBrains Mono"')
          ]).then(function() {
            document.documentElement.classList.remove('fonts-pending');
            document.documentElement.classList.add('fonts-ready');
          }).catch(function() {
            document.documentElement.classList.remove('fonts-pending');
          });
        } else {
          document.documentElement.classList.remove('fonts-pending');
        }
        setTimeout(function() {
          document.documentElement.classList.remove('fonts-pending');
        }, 2000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tripwire — verify before release</title>
    <meta name="description" content="Evidence before release. Tripwire verifies source backing, screening and customer rules for cross-chain USDC escrow payouts. Explore operations and the local incident replay." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tripwire" />
    <meta property="og:title" content="Tripwire — verify before release" />
    <meta property="og:description" content="A control layer for cross-chain USDC. Verify the source, check the policy, and hold the payment when the evidence doesn’t add up." />
    <meta property="og:image" content="https://chainstory-iota.vercel.app/brand/tripwire-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tripwire — Every payout. Prove it first." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripwire — verify before release" />
    <meta name="twitter:description" content="Evidence before release. Controls for cross-chain USDC payouts." />
    <meta name="twitter:image" content="https://chainstory-iota.vercel.app/brand/tripwire-social.png" />
    <meta name="theme-color" content="#0d0d12" />

    <!-- Theme before first paint: dark by default; a stored choice (ThemeToggle) wins, with no flash. -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tripwire-theme') || localStorage.getItem('chainstory-theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else if (t === 'system') document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
